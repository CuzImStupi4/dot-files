# vim:fileencoding=utf-8:foldmethod=marker

# -----------------------------------------------------------------------------
# FONTS
# Using Geist Mono as requested in your CSS
# -----------------------------------------------------------------------------
# font_family      DM Mono
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size        12.0
adjust_line_height 110%
disable_ligatures  never

# -----------------------------------------------------------------------------
# CURSOR & MOUSE
# -----------------------------------------------------------------------------
cursor                #ffffff
cursor_text_color     #000000
cursor_shape          block
cursor_blink_interval 0.5

cursor_trail 1

background_opacity 1
window_padding_width 4

mouse_map right click ungrabbed paste_from_clipboard

url_color             #0070f3
url_style             straight

# -----------------------------------------------------------------------------
# WINDOW LAYOUT
# Pure black background, minimalist borders
# -----------------------------------------------------------------------------
window_padding_width 10
hide_window_decorations titlebar-only
confirm_os_window_close 0



tab_powerline_style round

# -----------------------------------------------------------------------------
# TAB BAR
# -----------------------------------------------------------------------------
tab_bar_edge          top
tab_bar_style         separator
tab_separator         "  "
tab_bar_margin_width  10.0
tab_bar_margin_height 10.0 0.0

# Active: Vercel Blue background, White text
active_tab_foreground   #ffffff
active_tab_background   #0070f3
active_tab_font_style   bold

# Inactive: Dark Gray background, Gray text
inactive_tab_foreground #888888
inactive_tab_background #111111
inactive_tab_font_style normal

# -----------------------------------------------------------------------------
# COLOR SCHEME: Vercel Dark
# -----------------------------------------------------------------------------
# Pure Black Background
background            #000000
foreground            #ededed

# Selection (Dark Gray)
selection_background  #333333
selection_foreground  #ffffff

# The 16 Terminal Colors

# Black
color0  #111111
color8  #444444

# Red (Error)
color1  #ff453a
color9  #ff6666

# Green (Success)
color2  #3291ff
color10 #50e3c2

# Yellow (Warning)
color3  #f5a623
color11 #f7b955

# Blue (Vercel Blue)
color4  #0070f3
color12 #3291ff

# Magenta (Vercel Pink)
color5  #f81ce5
color13 #ff4ff8

# Cyan (Vercel Cyan)
color6  #79ffe1
color14 #aaffef

# White
color7  #bfbfbf
color15 #ffffff


# -----------------------------------------------------------------------------
# TRANSPARENCY & BLUR (Glassy Effect)
# -----------------------------------------------------------------------------
# 1.0 is fully opaque, 0.0 is fully transparent. Adjust to your liking!
background_opacity 0.6

background_blur 12

# Allows you to change opacity on the fly with keyboard shortcuts
dynamic_background_opacity yes


# BEGIN_KITTY_FONTS
font_family      family='DM Mono' postscript_name=DMMono-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
